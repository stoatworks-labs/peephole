# Type-check, test and build on every push and pull request.
#
# Separate from deploy.yml so that a Dependabot PR — which cannot deploy, and
# should not — still gets the same verdict the deploy would have given it.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lockfile matches manifest
        run: npm ls --all >/dev/null
      - run: npm test
      # `npm run build` is `tsc -b && vite build`, so this is the type-check too.
      - run: npm run build
      # build/icon.png is drawn by scripts/make-app-icon.mjs. Nothing else would
      # notice if the committed PNG and the code that draws it parted company.
      - run: npm run icon:check
      # The desktop shell, type-checked and compiled. Not packaged — that is
      # release.yml's job and takes forty minutes — but this is what catches a
      # change to src/ that the Electron renderer cannot build, which is most of
      # the ways the two shapes could drift apart.
      - run: npm run electron:build
