<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Peephole — a camera or capture card, full screen</title>
    <meta
      name="description"
      content="Open a webcam or capture card full screen in a browser tab. Device and mode picker so a capture card gives you its real resolution, mirror, rotate, fit or fill, and the screen stays awake. Nothing is recorded and nothing leaves the browser."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307090c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%234cc9f0' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%234cc9f0'/%3E%3C/svg%3E" />
    <link rel="canonical" href="https://peephole.stoatworks-labs.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Stoatworks Labs">
    <meta property="og:locale" content="en_GB">
    <meta property="og:url" content="https://peephole.stoatworks-labs.com/">
    <meta property="og:title" content="Peephole — a camera or capture card, full screen">
    <meta property="og:description" content="Open a webcam or capture card full screen in a browser tab. Device and mode picker, mirror, rotate, fit or fill, and the screen stays awake.">
    <!-- Card hosted on the main site: it is regenerated in place by the
         website's make_thumbnails.py and keeps its filename, so a copy
         vendored here would go stale without anything saying so. -->
    <meta property="og:image" content="https://stoatworks-labs.com/thumbs/peephole.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="720">
    <meta property="og:image:alt" content="Peephole — a camera or capture card, full screen">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://stoatworks-labs.com/thumbs/peephole.png">
    <meta name="theme-color" content="#07090c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons entirely and wants a PNG of its own. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here. Classic +
      defer like the support footer: about-data.js only sets defaults, so it and
      the app's own startup can load in either order.
    -->
    <script src="/about-data.js" defer></script>
    <script src="/about.js" defer></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run scripts/sync-support-footer.sh, never here.
      Classic + defer on purpose: it reads its config off this tag, and
      document.currentScript is null inside a module.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="Peephole"
      data-repo="https://github.com/stoatworks-labs/peephole"
      data-note="It runs entirely in your browser — the picture never leaves this machine, and nothing is recorded."
    ></script>
  </body>
</html>
