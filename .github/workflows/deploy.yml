# Build the page and put it in front of visitors.
#
# Deliberately the same shape as negative-space's and the website's own deploy
# workflows, so that a fix to one is obvious in the others: check the token
# first, run the suite, build, deploy with a pinned wrangler, then prove the
# live site is serving *this* build rather than trusting the upload's exit code.

name: deploy

on:
  push:
    branches: [main]
    # Prose changes nothing a visitor of this site sees. docs/USER-GUIDE.md is
    # the source the website builds its guide page from, and that is served
    # from stoatworks-labs.com rather than from here.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/dependabot.yml"
  workflow_dispatch:

# Newest push wins. Cancelling an in-flight build is safe: wrangler uploads the
# assets first and activates the version as one step at the end, so a run
# killed part way through never becomes the live version.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fail in a second rather than after a build. A deploy that cannot
      # authenticate is the whole point of this job failing to happen.
      - name: Check the Cloudflare token is present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repository, so the"
            echo "::error::site cannot be deployed. Create a Cloudflare API token with"
            echo "::error::the 'Edit Cloudflare Workers' template scoped to this account,"
            echo "::error::then:"
            echo "::error::  gh secret set CLOUDFLARE_API_TOKEN --repo stoatworks-labs/peephole"
            echo "::error::cf-run already uses such a token from the login keychain under"
            echo "::error::the service name 'stoatworks-cloudflare'; the same one works here."
            exit 1
          fi
          echo "token present - ok"

      - run: npm ci

      # The suite is what makes an automatic deploy defensible. Nothing here is
      # visible in a screenshot: a constraint built with `ideal` where it should
      # be `exact` gives you a picture from the wrong camera and looks perfect.
      - run: npm test

      - run: npm run build

      # wrangler is not a dependency of this project — locally it comes from
      # npx via `npm run deploy` — so the version is pinned here rather than
      # left to resolve to latest.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler's first-run metrics consent prompt would hang a
          # non-interactive run for ever.
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.116.0 deploy

      # Prove it landed, against the domain a visitor uses.
      #
      # The <head> is hashed rather than the whole body: Cloudflare injects a
      # bot-management script with a per-request nonce before </body>, so no
      # two responses are byte-identical and a whole-body comparison would fail
      # on a healthy deploy. Vite writes the hashed asset names into the head,
      # so this still catches a code change as well as a meta-only one.
      - name: Check the live site is serving this build
        run: |
          set -euo pipefail
          want=$(sed -n '1,/<\/head>/p' dist/index.html | shasum -a 256 | cut -d' ' -f1)
          echo "expecting the live <head> to hash to $want"
          for attempt in 1 2 3 4 5; do
            got=$(curl -sS --max-time 30 "https://peephole.stoatworks-labs.com/" \
                  | sed -n '1,/<\/head>/p' | shasum -a 256 | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then
              echo "live site is serving this build (attempt $attempt)"
              exit 0
            fi
            echo "not there yet, got $got — retrying in 10s (attempt $attempt)"
            sleep 10
          done
          echo "::error::Deployed, but https://peephole.stoatworks-labs.com/ is"
          echo "::error::still not serving this build's <head>. The upload succeeded, so"
          echo "::error::this is the edge serving something else — check the Worker's"
          echo "::error::routes, and that peephole is what the custom domain"
          echo "::error::actually points at."
          exit 1
