    <noscript>
      <h1>Peephole</h1>
      <p>Opens a webcam or an HDMI capture card full screen in a browser tab, and fixes the one thing a bare getUserMedia page gets wrong. A capture card advertises a list of modes and the browser picks a cautious one, so a card carrying 1080p opens at 640 × 480 and just looks soft. This asks the device what it can do, offers you those modes, and tells you what the stream actually settled on, including when that's smaller than what you asked for. There's mirror, quarter-turn rotation, fit or fill, a screen that stays awake while a picture's up, and a bar that fades out with the cursor in full screen. Nothing is recorded and nothing leaves the browser.</p>
      <p>It needs JavaScript to run.</p>
      <ul>
        <li><a href="https://stoatworks-labs.com/web-tools/peephole/">Peephole on Stoatworks Labs</a></li>
        <li><a href="https://stoatworks-labs.com/software/peephole/">Project page</a></li>

        <li><a href="https://github.com/stoatworks-labs/peephole">Source code on GitHub</a></li>
      </ul>
    </noscript>
